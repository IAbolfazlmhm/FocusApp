<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus App</title>
  <link rel="stylesheet" href="style.css">
  
  <script>
    (function() {
      const savedTimer = localStorage.getItem('focusTimerState');
      const savedSettings = localStorage.getItem('focusSettings');
      
      if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        if (settings.darkMode) document.body.setAttribute('data-theme', 'dark');
      }
      
      if (savedTimer) {
        const state = JSON.parse(savedTimer);
        if (state.timeLeft === 0 && state.totalTime === 0) {
        } else {
            if (state.currentPhase === 'work') document.body.classList.add('phase-work');
            else if (state.currentPhase === 'shortBreak') document.body.classList.add('phase-short');
            else if (state.currentPhase === 'longBreak') document.body.classList.add('phase-long');
        }
      }
    })();
  </script>
</head>
<body class="preload">

  <div id="toast-container"></div>

  <div class="header-container">
    <nav class="glass-tabs-container">
      <div class="active-bubble"></div>
      <button class="tab active">Pomodoro</button>
      <button class="tab">Habits</button>
      <button class="tab">Progress</button>
    </nav>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content glass-effect">
      <div class="modal-header">
        <h2>
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Settings
        </h2>
        <button class="close-btn" id="close-settings" title="Close">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      
      <div class="modal-body">
        <div class="setting-group">
          <label for="mode-select">Mode:</label>
          <select id="mode-select" class="custom-select">
            <option value="pomodoro">Pomodoro Timer</option>
            <option value="stopwatch">Stopwatch (Count up)</option>
          </select>
        </div>

        <div class="setting-group toggle-group">
            <label for="dark-mode-toggle">Dark mode</label>
            <label class="switch">
              <input type="checkbox" id="dark-mode-toggle">
              <span class="slider round"></span>
            </label>
        </div>

        <div class="setting-group toggle-group">
            <label for="sound-toggle">Sound Effects (Haptics):</label>
            <label class="switch">
              <input type="checkbox" id="sound-toggle" checked>
              <span class="slider round"></span>
            </label>
          </div>

        <div id="pomodoro-settings-wrapper">
          <div class="setting-group">
            <label for="work-duration">Work Duration:</label>
            <select id="work-duration" class="custom-select">
              <option value="10">10 Minutes</option>
              <option value="15">15 Minutes</option>
              <option value="25" selected>25 Minutes (Default)</option>
              <option value="45">45 Minutes</option>
              <option value="60">60 Minutes</option>
            </select>
          </div>

          <div class="setting-group toggle-group">
            <label for="breaks-toggle">Enable Breaks (Short/Long):</label>
            <label class="switch">
              <input type="checkbox" id="breaks-toggle" checked>
              <span class="slider round"></span>
            </label>
          </div>
          
          <div class="setting-group toggle-group">
            <label for="autostart-breaks-toggle">Auto-start Breaks:</label>
            <label class="switch">
              <input type="checkbox" id="autostart-breaks-toggle" checked>
              <span class="slider round"></span>
            </label>
          </div>
          
          <div class="setting-group">
            <label for="sound-select">Sound Alert:</label>
            <select id="sound-select" class="custom-select">
              <option value="mute">Mute (No Sound)</option>
              <option value="bell" selected>Soft Bell</option>
              <option value="digital">Digital Beep</option>
              <option value="bird">Bird Chirp</option>
            </select>
          </div>
        </div>

        <button class="save-settings-btn" id="save-settings">Save & Apply</button>
      </div>
    </div>
  </div>

  <main class="container">

    <div id="pomodoro-view" class="view-section active-view">
      <section class="timer-section">

        <div class="timer-header glass-pill">
          <span class="locked-task-label">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Focus: <strong id="current-task-name">Nothing</strong>
          </span>
          <button class="icon-btn settings-btn" title="Settings">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>

        <div class="session-tracker" id="session-tracker">
          <span id="current-phase">Work 1/4</span>
          <span id="next-phase">Next: Short Break</span>
        </div>

        <div class="timer-circle">
          <svg class="progress-ring" width="250" height="250">
            <circle class="progress-ring-track" stroke-width="8" fill="transparent" r="110" cx="125" cy="125"/>
            <circle class="progress-ring-circle" stroke-width="10" fill="transparent" r="110" cx="125" cy="125"/>
          </svg>
          <span class="time-display" id="time-left">25:00</span>
        </div>

        <div class="timer-controls glass-pill">
          <button class="icon-btn reset-btn" id="reset-btn" title="Reset (Double click for deep reset)">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          
          <button class="start-btn" id="start-btn">
             <span class="btn-text">Start</span>
          </button>
          
          <button class="icon-btn skip-btn" id="skip-btn" title="Skip to Next Phase">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
        </div>
      </section>

      <section class="tasks-section">
        
        <div class="filter-nav-wrapper">
            <button class="icon-btn manage-tags-btn" id="manage-tags-btn" title="Manage Tags">
              <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
            
            <div class="filter-scroll-area" id="filter-list">
                <div class="filter-bubble"></div>
                </div>
        </div>

        <div class="task-list-container">
          <div id="guide-text" class="guide-text">
              Your tasks will be grouped by date here...
          </div>
        </div>

        <div id="sort-dropdown" class="custom-dropdown glass-effect" style="width: 140px; top: 100%; left: 0; bottom: auto; position: absolute; z-index: 100;">
            <div class="dropdown-item" data-sort="newest">
                <svg class="ui-icon" style="width:14px;height:14px;margin-right:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> 
                <span>Newest</span> <span class="sort-dir" style="margin-left:auto; font-size:0.8rem;"></span>
            </div>
            <div class="dropdown-item" data-sort="time">
                <svg class="ui-icon" style="width:14px;height:14px;margin-right:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 22h14M5 2h14M7 22V16l5-6-5-6V2M17 22V16l-5-6 5-6V2"/></svg> 
                <span>Time Spent</span> <span class="sort-dir" style="margin-left:auto; font-size:0.8rem;"></span>
            </div>
            <div class="dropdown-item" data-sort="az">
                <svg class="ui-icon" style="width:14px;height:14px;margin-right:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg> 
                <span>A-Z</span> <span class="sort-dir" style="margin-left:auto; font-size:0.8rem;"></span>
            </div>
            <div class="dropdown-item" data-sort="tag">
                <svg class="ui-icon" style="width:14px;height:14px;margin-right:8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> 
                <span>By Tag</span> <span class="sort-dir" style="margin-left:auto; font-size:0.8rem;"></span>
            </div>
        </div>
          
        <div class="add-task-area glass-pill">
          <div class="tag-selector-wrapper" style="position: relative;">
             <input type="text" placeholder="#Tag" class="tag-input" id="new-task-tag" autocomplete="off" maxlength="15">
             <div id="custom-tag-dropdown" class="custom-dropdown glass-effect"></div>
          </div>
          <input type="text" placeholder="Add a new task..." class="task-input" maxlength="60">
          <button class="add-btn">Add</button>
        </div>
      </section>

    <div class="modal-overlay" id="tags-modal">
      <div class="modal-content glass-effect">
          <div class="modal-header">
              <h2><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> Manage Tags</h2>
              <button class="close-btn" id="close-tags-modal"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
          <div class="modal-body">
              <div class="add-tag-row">
                  <input type="text" id="manage-new-tag-input" placeholder="New tag name..." class="custom-select" style="flex:1;">
                  <button id="manage-add-tag-btn" class="add-btn" style="padding: 8px 15px;">Add</button>
              </div>
              <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 15px 0;">
              <div id="tags-management-list" class="tags-list-grid"></div>
              <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 15px; text-align: center;">Click to delete.</p>
          </div>
      </div>
    </div>

    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content glass-effect" style="max-width: 300px; text-align: center;">
            <h3 id="confirm-message" style="margin-bottom: 20px; color: #2b2d42;">Are you sure?</h3>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="confirm-yes-btn" class="add-btn" style="background: #ef4444;">Yes, Delete</button>
                <button id="confirm-no-btn" class="add-btn" style="background: #64748b;">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-tag-modal">
        <div class="modal-content glass-effect" style="max-width: 300px;">
            <h3 style="margin-bottom: 15px;">Set Tag</h3>
            <div id="edit-tag-list" class="tags-list-grid"></div>
            <button id="close-edit-tag" class="add-btn" style="width:100%; margin-top:15px; background:#64748b;">Cancel</button>
        </div>
    </div>
      
    <div id="habits-view" class="view-section" style="display: none;">
      <div class="glass-pill placeholder-box">
        <h2>🌱 Habits Tracker</h2>
        <p>This section is under construction...</p>
      </div>
    </div>

    <div id="progress-view" class="view-section" style="display: none;">
      <div class="glass-pill placeholder-box">
        <h2>📊 Your Progress</h2>
        <p>This section is under construction...</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
