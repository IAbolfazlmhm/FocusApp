<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Stopwatch icon">
  <g fill="none" stroke="#0C098C" stroke-width="11" stroke-linecap="round">
    <!-- side "ears" -->
    <path d="M20 27 L9 16"/>
    <path d="M80 27 L91 16"/>
    <!-- top knob -->
    <path d="M50 12 L50 4"/>
    <path d="M42 4 L58 4"/>
  </g>

  <!-- outer navy ring -->
  <circle cx="50" cy="57" r="38" fill="#0C098C"/>
  <!-- coral face -->
  <circle cx="50" cy="57" r="29" fill="#FF7972"/>

  <!-- clock hand -->
  <path d="M50 40 L50 55 L62 67" fill="none" stroke="#0C098C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
